name: Windows build and regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Run core regression tests
        shell: powershell
        run: .\test.ps1 -NonInteractive
      - name: Test release transaction with isolated fakes
        shell: powershell
        run: .\tests\ReleaseTests.ps1 -NonInteractive
      - name: Build desktop application
        shell: powershell
        run: .\build.ps1 -NonInteractive
      - name: Upload executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: koi-windows-${{ github.sha }}
          path: |
            artifacts/Koi.exe
            artifacts/Koi.exe.sha256
          if-no-files-found: error
